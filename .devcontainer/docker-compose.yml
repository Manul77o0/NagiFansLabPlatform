services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    volumes:
      - ..:/workspace:cached
      - ./wireguard-test/data:/run/wireguard-test
    environment:
      WG_TEST_APPLY_DIR: /run/wireguard-test

  mail:
    image: schickling/mailcatcher
    ports:
      - "1080:1080"
      - "1025:1025"
