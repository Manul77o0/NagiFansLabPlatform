[project]
name = "nagifanslabplatform"
version = "0.1.0"
description = "Platform For NagifansLab"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "itsdangerous>=2.2.0",
    "loguru>=0.7.3",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "app.main:app"

[tool.uv]
package = false
