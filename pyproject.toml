[project]
name = "nagifanslabplatform"
version = "0.1.0"
description = "Platform For NagifansLab"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "app.main:app"
