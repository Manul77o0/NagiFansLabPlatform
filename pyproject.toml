[project]
name = "nagifanslabplatform"
version = "0.1.0"
description = "Platform For NagifansLab"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi[standard]>=0.162.0",
    "itsdangerous>=2.2.0",
    "loguru>=0.7.3",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.1.6",
    "sqlmodel>=0.0.48",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "app.main:app"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py312"
extend-exclude = ["app/migration", "dist", "build", "node_modules"]

# --- Lint: 実害系 + FastAPI 向けだけを有効化 ---
[tool.ruff.lint]
select = [
    "D", # pydocstyle（docstringのスタイルチェック）
    "F", # Pyflakes（未使用/未定義）
    "I", # import 並べ替え（isort 相当）
    "UP", # pyupgrade（最新構文へ）
    "B", # bugbear（バグ誘発パターン）
    "C4", # 内包表記の最適化
    "RUF", # Ruff 独自
    "FAST", # ← FastAPI 向けルール（Annotated 推奨など）
]

ignore = [
    "D100", # モジュールの docstring チェックを無効化
    "D101","D103", # 公開関数の docstring チェックを無効化
    "D107", # __init__.py の docstring チェックを無効化
    "D400", # docstringのピリオドを無効化
    "D415", # docstringの最終行に空行を要求しない
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]  # B008 回避用  [oai_citation:1‡GitHub](https://github.com/tiangolo/fastapi/issues/1522?utm_source=chatgpt.com)

# --- Formatter: ruff format ---
[tool.ruff.format]
quote-style = "double"      # Black互換。好みで "preserve" でもOK
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = "dynamic"
